name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
      - run: npm run check
        env:
          # Enables the live migration-drift check. When unset (e.g. on forks),
          # the check skips gracefully and the rest of `npm run check` still runs.
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One grouped PR for routine minor/patch bumps; the `quality` check gates them.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Expo pins the entire native module matrix per SDK; bumping expo-*/react-native
      # majors out of band breaks the standalone build. check-mobile-runtime.mjs is the
      # gate for those — upgrade them deliberately via `expo install`, not Dependabot.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
